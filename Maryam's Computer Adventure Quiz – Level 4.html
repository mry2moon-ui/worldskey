<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Maryam’s Computer Adventure Quiz – Level 4</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{--bg:#FFF1CC;--card:#fff;--ink:#2B2A4C;--pink:#FF5D8F;--sky:#2EB5FF;--mint:#16C79A;--sun:#FFC93C;--grape:#7C5CFF;--org:#FF8A3D;--ok:#0FA37F;--bad:#EF476F;--soft:#F4F0FF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231E47;--card:#332C66;--ink:#FFF1CC;--soft:#3F377A}}
:root[data-theme="dark"]{--bg:#231E47;--card:#332C66;--ink:#FFF1CC;--soft:#3F377A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Baloo 2","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;font-weight:500;font-size:18px;color:var(--ink);background:var(--bg) radial-gradient(circle at 12% 18%,#FF5D8F33 0 70px,transparent 71px),radial-gradient(circle at 90% 12%,#2EB5FF33 0 90px,transparent 91px),radial-gradient(circle at 85% 88%,#16C79A33 0 110px,transparent 111px);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:9}
main{max-width:820px;margin:0 auto;padding:14px}
h1,h2{font-weight:800;line-height:1.1;margin:0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid var(--grape);outline-offset:2px}
.hero{text-align:center;background:var(--card);border-radius:36px;padding:22px 18px 26px;border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink)}
.hero h1{font-size:clamp(34px,8vw,58px);color:var(--pink);text-shadow:3px 3px 0 var(--sun)}
.hero .nm{display:inline-block;margin:12px 0;padding:6px 22px;border-radius:99px;background:var(--grape);color:#fff;font-size:clamp(20px,5vw,30px);font-weight:800;transform:rotate(-2deg)}
.hero .bw{width:min(320px,80%);margin:8px auto;animation:fl 3s ease-in-out infinite}
.lessons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 16px}
.lessons b{padding:4px 14px;border-radius:99px;color:#fff}
.lessons b:nth-child(1){background:var(--mint)}.lessons b:nth-child(2){background:var(--sky)}.lessons b:nth-child(3){background:var(--org)}
.go{font-size:26px;font-weight:800;padding:10px 34px;border:4px solid var(--ink);border-radius:99px;background:var(--sun);color:#2B2A4C;box-shadow:0 6px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-weight:800}
.top span{background:var(--card);padding:2px 14px;border-radius:99px;border:3px solid var(--ink);font-size:15px}
.prog{display:flex;gap:4px;margin-bottom:10px}.prog i{flex:1;height:12px;border-radius:9px;background:#0002}.prog i.d{background:var(--mint)}.prog i.n{background:var(--pink);animation:pulse 1s infinite}
.card{background:var(--card);border-radius:30px;border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink);padding:14px;overflow:hidden}
.qh{display:flex;justify-content:space-between;font-weight:800;color:var(--grape);margin-bottom:8px}
.stage{position:relative;min-height:235px;border-radius:22px;background:var(--st);border:3px dashed #fff9;padding:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:12px;color:#2B2A4C}
.stage.no{animation:shake .5s}.stage.ok::after{content:"🎉✨⭐";position:absolute;top:4px;right:10px;font-size:34px;animation:pop .6s}
h2{font-size:clamp(21px,4.6vw,28px);margin:4px 0 12px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;font-size:20px;font-weight:700;padding:10px 16px;border-radius:18px;background:var(--soft);border:3px solid var(--c);border-bottom-width:7px;transition:transform .12s}
.opt:hover{transform:translateY(-2px)}.opt .l{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800}.opt .em{font-size:30px}
.opt:nth-child(1){--c:#FF5D8F}.opt:nth-child(2){--c:#2EB5FF}.opt:nth-child(3){--c:#16C79A}.opt:nth-child(4){--c:#FF8A3D}
.opt.good{background:#16C79A;color:#fff;border-color:var(--ok);animation:pop .5s}.opt.bad{background:var(--bad);color:#fff;border-color:#b8264a;animation:shake .5s}
.row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-weight:800}.row span{flex:none;width:80px}
select{flex:1;font:inherit;font-weight:700;padding:8px 10px;border-radius:14px;border:3px solid var(--grape);background:var(--soft);color:var(--ink)}
select.good{border-color:var(--ok);background:#16C79A44}select.bad{border-color:var(--bad);background:#EF476F44}
.fb{display:flex;gap:10px;align-items:center;margin-top:12px;padding:8px 12px;border-radius:20px;background:var(--soft)}.fb p{margin:0;font-size:17px}.bot{font-size:38px;animation:fl 2s ease-in-out infinite}
.nx{display:block;margin:12px 0 0 auto}
.bd{width:100%;height:auto;max-height:170px}.pin circle{fill:#fff;stroke:#2B2A4C;stroke-width:3}.pin text{font:800 14px "Baloo 2",sans-serif;text-anchor:middle;fill:#2B2A4C}.pin.hl circle{fill:#FFC93C;animation:pulse .6s infinite}
.leg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}.leg div{background:#fff;border-radius:99px;padding:0 12px;font-weight:700;font-size:15px}.leg i{font-style:normal;background:#2B2A4C;color:#fff;border-radius:50%;padding:0 7px;margin-right:6px}
.tagw{position:relative;display:flex;flex-direction:column;align-items:center;width:100%}.tk{position:relative;height:42px;width:100%;margin-top:6px}
.tk span{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;font-size:26px;font-weight:800;background:#fff;border-radius:99px;padding:0 22px;opacity:0;animation:cyc 6s infinite}.tk span:nth-child(2){animation-delay:2s}.tk span:nth-child(3){animation-delay:4s}
.hub{position:relative;width:100%;height:215px}.hub svg{position:absolute;inset:0;width:100%;height:100%}.hub line{stroke:#fff;stroke-width:4;stroke-dasharray:10 8;animation:dash .8s linear infinite}
.ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;text-align:center;font-size:56px;font-weight:800;line-height:1}.ctr small{display:block;font-size:20px}
.sat{position:absolute;font-size:44px;animation:bob 1.6s ease-in-out infinite;animation-delay:var(--d)}.s0{left:5%;top:2%}.s1{right:5%;top:2%}.s2{left:5%;bottom:2%}.s3{right:5%;bottom:2%}
.ok .ctr{animation:pop .6s infinite alternate}
.items{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;position:relative}.it{background:#fff;border-radius:18px;text-align:center;font-size:50px;padding:6px 0;font-weight:700;transition:.3s}.it small{display:block;font-size:15px}.it.good{background:#16C79A;transform:scale(1.1) rotate(-3deg)}.it.bad{opacity:.5;animation:shake .5s}
.scan{position:absolute;top:0;bottom:0;width:8px;background:#fff;box-shadow:0 0 18px 8px #fff;border-radius:9px;animation:scan 2.4s ease-in-out infinite alternate}
.abbr{display:flex;gap:10px;width:100%;justify-content:center}.ab{background:#fff;border-radius:20px;padding:6px 14px;text-align:center;flex:1;max-width:150px}.ab b{display:block;font-size:60px;line-height:1;color:var(--pink)}.ab:nth-child(2) b{color:var(--sky)}.ab:nth-child(3) b{color:var(--mint)}.ab span{font-size:18px;font-weight:800;animation:cyc2 4s infinite}.ab:nth-child(2) span{animation-delay:.6s}.ab:nth-child(3) span{animation-delay:1.2s}
.heat{display:grid;grid-template-columns:90px 40px 1fr;gap:12px;align-items:center;width:100%}.pc{font-size:64px;position:relative;text-align:center}.pc.hot{animation:shake .3s infinite}.fan{position:absolute;right:-4px;bottom:-4px;font-size:26px;animation:spin var(--fs,2s) linear infinite}
.th{width:26px;height:150px;background:#fff;border-radius:20px;border:3px solid #2B2A4C;display:flex;align-items:flex-end;overflow:hidden}#thb{width:100%;height:30%;background:#2EB5FF;transition:.2s}
.sp{font-weight:800}.bar{height:16px;background:#fff;border-radius:9px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;width:100%;background:#16C79A;transition:.2s}.heat input{width:100%;accent-color:#EF476F}.hs{background:#fff;border-radius:14px;padding:2px 10px;font-size:16px}
.gauge{width:min(330px,100%)}.nd{transform-origin:120px 120px;animation:sweep 2.2s ease-in-out infinite alternate}.ok .nd{animation-duration:.8s}
.fl{display:flex;align-items:center;gap:4px;width:100%;justify-content:center}.col{text-align:center;flex:1}.bx{background:#fff;border:3px solid #2B2A4C;border-radius:16px;padding:6px 4px;font-size:18px;font-weight:800;min-height:46px;display:grid;place-items:center;color:var(--grape)}.bx.cp{color:var(--pink)}.em{font-size:28px;margin-top:4px}
.ar{width:46px;height:8px;border-radius:9px;background:repeating-linear-gradient(90deg,#fff 0 8px,transparent 8px 14px);position:relative;flex:none}.pkt{position:absolute;top:-8px;left:0;width:22px;height:22px;border-radius:50%;background:#FFC93C;border:3px solid #2B2A4C;animation:mv 1.2s linear infinite}.bi .pkt{animation-direction:alternate;animation-timing-function:ease-in-out}.ok .pkt{animation-duration:.4s}
.boot{width:100%;display:grid;gap:8px;text-align:center}.scr{background:#1d2b53;color:#7CFFB2;font:700 17px/1.3 monospace;border-radius:14px;padding:10px;min-height:92px;border:4px solid #2B2A4C;text-align:left}
.pw{justify-self:center;font-size:20px;font-weight:800;padding:4px 20px;border-radius:99px;border:3px solid #2B2A4C;background:#FF5D8F;color:#fff}.romc{justify-self:center;background:#fff;border-radius:10px;padding:0 16px;font-weight:800;transition:.3s}.romc.on{background:#FFC93C;box-shadow:0 0 22px #FFC93C;transform:scale(1.15)}
.lane{display:flex;align-items:center;gap:8px;width:100%;font-weight:800}.lane b{width:104px;flex:none;font-size:16px}.track{flex:1;height:44px;background:#fff9;border-radius:99px;position:relative;overflow:hidden}.rc{position:absolute;left:4px;top:2px;font-size:32px;font-style:normal}
.race{display:grid;gap:8px;width:100%;justify-items:center}.race.run .r1{animation:run 1s forwards}.race.run .r2{animation:run 4s forwards}
.mem{display:grid;grid-template-columns:1fr 60px 1fr;gap:6px;align-items:center;width:100%;text-align:center;font-weight:800}.mem>div:first-child,.ramb{background:#fff;border-radius:16px;padding:8px;font-size:17px}.ramb.good{background:#16C79A;color:#fff;animation:pop .5s}#rm{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:36px;font-size:22px}.lnk{height:8px;background:repeating-linear-gradient(90deg,#fff 0 8px,transparent 8px 14px);position:relative}.lnk i{position:absolute;top:-8px;left:0;font-style:normal;font-size:20px;display:none}.lnk.f i{display:block;animation:mv2 .8s linear}
.apps{display:flex;gap:8px;width:100%;justify-content:center;margin-top:8px}.apps button{font-size:34px;background:#fff;border:3px solid #2B2A4C;border-radius:16px;padding:0 12px}
.ramw{width:100%;display:grid;gap:8px;justify-items:center}.slots{display:flex;gap:8px;background:#1fb26b;padding:10px;border-radius:14px;border:4px solid #0e7a48}.slot{width:44px;height:78px;border-radius:6px;background:#0e7a48;border:3px dashed #b6ffd9;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}.slot.on{background:#FFC93C;border:3px solid #8a5a00;color:#2B2A4C;animation:pop .4s}
.addb{font-weight:800;font-size:18px;padding:4px 18px;border-radius:99px;background:#7C5CFF;color:#fff;border:3px solid #2B2A4C}.apl{font-size:30px;min-height:38px}
.chp{display:flex;gap:10px;width:100%;justify-content:center}.cp1{background:#fff;border-radius:18px;padding:10px 8px;text-align:center;font-weight:800;flex:1;font-size:18px;animation:bob 1.8s ease-in-out infinite}.cp1:nth-child(2){animation-delay:.3s}.cp1:nth-child(3){animation-delay:.6s}.cp1 span{display:block;font-size:44px}.cp1 small{display:block;font-size:16px;color:var(--pink);opacity:0}.done .cp1 small{opacity:1}.cp1.good{background:#16C79A;color:#fff}.cp1.good small{color:#fff}.cp1.bad{opacity:.6}
.res{text-align:center}.stars{font-size:54px;letter-spacing:6px}.cert{margin:14px 0;padding:16px;border-radius:26px;background:linear-gradient(135deg,#FFC93C,#FF8A3D);border:5px double #2B2A4C;color:#2B2A4C}.cert h2{font-size:clamp(22px,6vw,34px);color:#7C2D12}.cert .n{font-size:clamp(24px,6.4vw,38px);font-weight:800;background:#fff;border-radius:16px;margin:8px 0;padding:2px 8px}
.rv{text-align:left;margin-top:10px}.rv p{margin:6px 0;padding:6px 12px;border-radius:12px;background:var(--soft);font-size:16px}.cf{position:fixed;top:-20px;font-size:26px;animation:fall linear forwards;z-index:20;pointer-events:none}
@keyframes fl{50%{transform:translateY(-10px)}}@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}@keyframes pulse{50%{transform:scale(1.18)}}@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.2)}100%{transform:scale(1)}}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes cyc{0%,4%{opacity:0;transform:translateY(14px)}12%,30%{opacity:1;transform:none}38%,100%{opacity:0;transform:translateY(-14px)}}@keyframes cyc2{0%,100%{opacity:.2}25%,70%{opacity:1}}@keyframes dash{to{stroke-dashoffset:-18}}@keyframes scan{to{left:96%}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes sweep{from{transform:rotate(-75deg)}to{transform:rotate(70deg)}}@keyframes mv{to{left:26px}}@keyframes mv2{to{left:calc(100% - 20px)}}@keyframes run{to{left:calc(100% - 44px)}}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media(max-width:520px){.heat{grid-template-columns:70px 34px 1fr}.items .it{font-size:38px}.ctr{font-size:44px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
@media print{body{background:#fff}.top,.prog,.go,.rv,.noprint{display:none!important}}
</style></head><body><main id="app"></main>
<script>
const $=s=>document.querySelector(s),NAME="Maryam Waleed Khalid Al-Fatlawi";
const BD=(p)=>`<svg class="bd" viewBox="0 0 300 200"><rect x="8" y="8" width="284" height="184" rx="14" fill="#1fb26b" stroke="#0e7a48" stroke-width="4"/><path d="M40 90H100M120 120V150H200M150 20V45" stroke="#b6ffd9" stroke-width="2" fill="none" opacity=".7"/><rect x="105" y="50" width="60" height="60" rx="6" fill="#c9d1dd" stroke="#5b6478" stroke-width="3"/><rect x="118" y="63" width="34" height="34" rx="4" fill="#7C5CFF"/><rect x="205" y="25" width="14" height="95" rx="2" fill="#FFC93C" stroke="#8a5a00"/><rect x="228" y="25" width="14" height="95" rx="2" fill="#FFC93C" stroke="#8a5a00"/><g fill="#2EB5FF"><rect x="20" y="145" width="22" height="34" rx="3"/><rect x="48" y="145" width="22" height="34" rx="3"/><rect x="76" y="145" width="22" height="34" rx="3"/></g><g fill="#FF5D8F"><circle cx="60" cy="30" r="8"/><circle cx="85" cy="30" r="8"/></g>${p?[[59,162],[72,52],[135,80],[224,72]].map((c,k)=>`<g class="pin" data-p="${k}"><circle cx="${c[0]}" cy="${c[1]}" r="12"/><text x="${c[0]}" y="${c[1]+5}">${k+1}</text></g>`).join(''):''}</svg>`;
const hub=(c,a)=>`<div class="hub"><svg viewBox="0 0 400 200" preserveAspectRatio="none"><line x1="200" y1="100" x2="50" y2="30"/><line x1="200" y1="100" x2="350" y2="30"/><line x1="200" y1="100" x2="50" y2="170"/><line x1="200" y1="100" x2="350" y2="170"/></svg><div class="ctr">${c}</div>${a.map((e,i)=>`<span class="sat s${i}" style="--d:${i*.4}s">${e}</span>`).join('')}</div>`;
const leg=a=>`<div class="leg">${a.map((t,i)=>`<div><i>${i+1}</i><span data-t="${i}">?</span></div>`).join('')}</div>`;
const flow3=`<div class="fl bi"><div class="col"><div class="bx" data-t="0">?</div><div class="em">🧠</div></div><div class="ar"><i class="pkt"></i></div><div class="col"><div class="bx" data-t="1">?</div><div class="em">⚡</div></div><div class="ar"><i class="pkt"></i></div><div class="col"><div class="bx" data-t="2">?</div><div class="em">💽</div></div></div>`;
const S={
names:()=>`<div class="tagw">${BD()}<div class="tk"><span>Mainboard</span><span>System board</span><span>Circuit board</span></div></div>`,
connect:()=>hub(BD().replace('class="bd"','style="width:150px"'),['🖥️','⌨️','🖱️','🔊']),
items:q=>`<div class="items">${q.e.map((e,i)=>`<div class="it" data-o="${i}">${e}<small>${q.o[i]}</small></div>`).join('')}<i class="scan"></i></div>`,
board:()=>`<div style="width:100%;text-align:center">${BD(1)}${leg([0,1,2,3])}</div>`,
abbr:()=>`<div class="abbr"><div class="ab"><b>C</b><span>Central</span></div><div class="ab"><b>P</b><span>Processing</span></div><div class="ab"><b>U</b><span>Unit</span></div></div>`,
brain:()=>hub('🧠<small>CPU: “Do this!”</small>',['🖥️','⌨️','🖨️','💽']),
heat:()=>`<div class="heat"><div class="pc" id="pc">💻<span class="fan" id="fan">🌀</span></div><div class="th"><div id="thb"></div></div><div><div class="sp">Computer speed<div class="bar"><i id="spb"></i></div></div><div class="hs" id="hs">Cool and fast ⚡</div><input id="tr" type="range" min="30" max="100" value="40" aria-label="CPU temperature"><small>🌡️ <b id="tv">40</b>°C — slide to heat up the CPU!</small></div></div>`,
gauge:()=>`<svg class="gauge" viewBox="0 0 240 150"><path d="M20 120A100 100 0 0 1 80 28" stroke="#16C79A" stroke-width="22" fill="none"/><path d="M80 28A100 100 0 0 1 160 28" stroke="#FFC93C" stroke-width="22" fill="none"/><path d="M160 28A100 100 0 0 1 220 120" stroke="#FF5D8F" stroke-width="22" fill="none"/><g class="nd"><line x1="120" y1="120" x2="120" y2="38" stroke="#2B2A4C" stroke-width="7" stroke-linecap="round"/></g><circle cx="120" cy="120" r="12" fill="#2B2A4C"/><text x="120" y="147" text-anchor="middle" font-size="20" font-weight="800" fill="#2B2A4C">CPU speed in GHz</text></svg>`,
flow2:()=>`<div class="fl"><div class="col"><div class="bx" data-t="0">?</div><div class="em">⌨️🖱️</div></div><div class="ar"><i class="pkt"></i></div><div class="col"><div class="bx cp">🧠 CPU</div><div class="em">💾</div></div><div class="ar"><i class="pkt"></i></div><div class="col"><div class="bx" data-t="1">?</div><div class="em">🖥️🖨️</div></div></div>`,
rom:()=>`<div class="boot"><div class="scr" id="bs">Press the power button to wake up the computer…</div><div class="romc" id="rc">ROM • BIOS chip</div><button class="pw" id="pw">⏻ Power on</button></div>`,
race:()=>`<div class="race" id="rcs"><div class="lane"><b>⚡ RAM</b><div class="track"><i class="rc r1">🚀</i></div></div><div class="lane"><b>💽 Hard drive</b><div class="track"><i class="rc r2">🐌</i></div></div><button class="addb" id="rb">🏁 Race again!</button></div>`,
open:()=>`<div style="width:100%"><div class="mem"><div>💽 Hard drive<br>(stores files)</div><div class="lnk" id="lk"><i>📦</i></div><div class="ramb" id="rmb">RAM<div id="rm"></div></div></div><div class="apps">${['🎮','📝','🎨','🎵'].map(a=>`<button aria-label="Open program ${a}">${a}</button>`).join('')}</div><small>Tap a program to open it!</small></div>`,
flow3:()=>flow3,
addram:()=>`<div class="ramw"><div class="slots">${[0,1,2,3].map(()=>'<div class="slot">empty</div>').join('')}</div><button class="addb" id="ab">➕ Add a RAM module</button><div class="apl" id="apl"></div><b id="am"></b></div>`,
cpus:q=>`<div class="chp">${q.o.map((t,i)=>`<div class="cp1" data-o="${i}"><span>🔲</span>${t}<small>${q.br[i]}</small></div>`).join('')}</div>`
};
const INIT={

{k:'sel',q:'Look at the motherboard. Choose the correct part for each number.',slots:['Part 1','Part 2','Part 3','Part 4'],ans:['Peripheral connectors','Transistor','CPU socket','RAM slot'],pool:['CPU socket','RAM slot','Peripheral connectors','Transistor'],s:'board',w:'1 = Peripheral connectors, 2 = Transistor, 3 = CPU socket, 4 = RAM slot.'},

const COL=['#BDE8FF','#FFD6E5','#CFF7E6','#FFE9A8','#E2D9FF'],PR=['Super! 🌟','Brilliant! 🎉','Wow, Maryam! 🚀','Perfect! ⭐','You’re a star! 🥳'];

function beep(g){try{au=au||new(window.AudioContext||window.webkitAudioContext)();(g?[660,880]:[220]).forEach((f,k)=>{const o=au.createOscillator(),v=au.createGain();o.frequency.value=f;o.connect(v);v.connect(au.destination);v.gain.setValueAtTime(.12,au.currentTime+k*.15);v.gain.exponentialRampToValueAtTime(.001,au.currentTime+k*.15+.25);o.start(au.currentTime+k*.15);o.stop(au.currentTime+k*.15+.3)})}catch(e){}}
function start(){$('#app').innerHTML=`<section class="hero"><div class="bw">${BD()}</div><h1>Computer Adventure Quiz</h1><div class="nm">Maryam Waleed Khalid Al-Fatlawi</div><p><b>Computer • Level 4 • Grade 4</b><br>Hi Maryam! I’m Chip 🤖. Watch, tap and play with every picture. They will help you answer!</p><div class="lessons"><b>Motherboard</b><b>CPU</b><b>ROM &amp; RAM</b></div><button class="go" id="st">Start! 🚀</button></section>`;$('#st').onclick=()=>{i=0;pts=0;log=[];show()}}

else{a.innerHTML=q.slots.map((s,j)=>`<div class="row"><span>${s}</span><select data-j="${j}"><option value="">Choose…</option>${q.pool.map(p=>`<option>${p}</option>`).join('')}</select></div>`).join('')+'<button class="go" id="ck" style="font-size:20px;padding:4px 22px">Check my answers ✔</button>';a.querySelectorAll('select').forEach(s=>s.onchange=()=>{const j=+s.dataset.j,e=document.querySelector(`[data-t="${j}"]`);if(e)e.textContent=s.value||'?';document.querySelectorAll('.pin').forEach(p=>p.classList.toggle('hl',+p.dataset.p==j))});$('#ck').onclick=check}

function fin(ok,gain){done=1;const q=Q[i],st=$('#stage');st.classList.add(ok?'ok':'no','done');setTimeout(()=>st.classList.remove('no'),700);st.querySelectorAll('[data-o]').forEach(e=>e.classList.toggle('good',+e.dataset.o==q.a));pts+=gain;log.push({q:q.q,ok,w:q.w});beep(ok);$('#say').innerHTML=(ok?PR[i%5]+' ':'Not quite, but you’re learning! ')+q.w;$('#nx').hidden=0;$('#nx').focus()}
function pick(j){if(done)return;const q=Q[i];document.querySelectorAll('.opt').forEach((b,k)=>{if(k==q.a)b.classList.add('good');else if(k==j)b.classList.add('bad')});const s=document.querySelector(`#stage [data-o="${j}"]`);if(s&&j!=q.a)s.classList.add('bad');fin(j==q.a,j==q.a?1:0)}
